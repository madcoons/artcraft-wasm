name: Build PhotoCraft

# Builds and packs photocraft/. Called by ci.yml and photocraft-release.yml; uploads the .tgz as `photocraft-package`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pack:
    name: Build and pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The engine is a long compile; reuse it while Cargo.lock and the toolchain stay the same.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            photocraft/target
          key: photocraft-cargo-${{ hashFiles('photocraft/rust-toolchain.toml', 'photocraft/Cargo.lock') }}
          restore-keys: photocraft-cargo-
      # rustup is on the runner; rust-toolchain.toml makes it install the pinned compiler and target.
      - run: photocraft/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: photocraft-package
          path: photocraft/*.tgz
          if-no-files-found: error
