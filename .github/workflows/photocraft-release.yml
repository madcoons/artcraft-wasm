name: Release PhotoCraft

# Pushing tag photocraft-v<version> builds photocraft/ and attaches the .tgz to a GitHub release of that
# tag. The tag must match `version` in photocraft/Cargo.toml.

on:
  push:
    tags: ["photocraft-v*"]

permissions:
  contents: read

concurrency:
  group: release-photocraft
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' photocraft/Cargo.toml | head -n 1)"
          if [ "$TAG" != "photocraft-v$version" ]; then
            echo "::error::Tag $TAG doesn't match version $version in photocraft/Cargo.toml."
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/photocraft-build.yml

  release:
    name: Create the release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: photocraft-package
          path: photocraft
      - env:
          GH_TOKEN: ${{ github.token }}
        run: photocraft/release.sh "${{ github.ref_name }}"
