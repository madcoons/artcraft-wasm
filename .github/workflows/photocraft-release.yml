name: Release PhotoCraft

# Every day: release each upstream PhotoCraft version that has no release here yet (stable releases from
# MIN_VERSION on, at least MIN_AGE_HOURS old). Each one is built from main with photocraft/bump.sh applied
# to the checkout, and its tag is made at that main commit: nothing is committed. The packaging revision is
# photocraft/REVISION; raising it releases every version again at the new revision. Run it by hand to
# release one version now, without waiting.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      photocraft-version:
        description: "Upstream version to release now, e.g. 0.14.0 (empty: every missing release)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-photocraft
  cancel-in-progress: false

env:
  MIN_VERSION: "0.11.1"
  # Time for upstream to pull a bad release before we package it.
  MIN_AGE_HOURS: "24"

jobs:
  plan:
    name: Find releases to publish
    runs-on: ubuntu-24.04
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.photocraft-version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            versions="$(jq -cn --arg v "${INPUT_VERSION#v}" '[$v]')"
          else
            versions="$(photocraft/missing-releases.sh "$MIN_VERSION" "$MIN_AGE_HOURS")"
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Releasing: $versions (revision $(cat photocraft/REVISION))" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        photocraft-version: ${{ fromJSON(needs.plan.outputs.versions) }}
    uses: ./.github/workflows/photocraft-build.yml
    with:
      photocraft-version: ${{ matrix.photocraft-version }}

  # Runs only when every version built; a version that failed is retried the next day.
  publish:
    name: Release ${{ matrix.photocraft-version }}
    needs: [plan, build]
    if: needs.plan.outputs.versions != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      # Oldest first, one at a time, so the newest version ends up as the latest release.
      max-parallel: 1
      matrix:
        photocraft-version: ${{ fromJSON(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: photocraft-package-${{ matrix.photocraft-version }}
          path: photocraft
      - env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM: ${{ matrix.photocraft-version }}
        run: |
          tag="photocraft-v$(photocraft/package-version.sh "$UPSTREAM")"
          photocraft/release.sh "$tag" "$UPSTREAM" "$GITHUB_SHA"
