name: Build

# Builds and packs the npm package. Called by ci.yml and release.yml; uploads the .tgz as `package`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pack:
    name: Build and pack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The engine is a long compile; reuse it while Cargo.lock and the toolchain stay the same.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # rustup is on the runner; rust-toolchain.toml makes it install the pinned compiler and target.
      - run: ./build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"
          if-no-files-found: error
