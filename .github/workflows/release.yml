name: Release

# Pushing tag v<version> builds the package and attaches the .tgz to a GitHub release of that tag.
# The tag must match `version` in Cargo.toml.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match version $version in Cargo.toml."
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  release:
    name: Create the release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          file="$(ls *.tgz)"
          upstream="$(sed -n 's/^photocraft-engine = .*tag = "\(v[^"]*\)".*/\1/p' Cargo.toml)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${file}"
          {
            echo "The PhotoCraft engine ${upstream} compiled to WebAssembly."
            echo
            echo "Install it in package.json:"
            echo
            echo '```json'
            echo "\"@madcoons/photocraft-wasm\": \"${url}\""
            echo '```'
          } > notes.md
          gh release create "$TAG" "$file" --title "$TAG" --notes-file notes.md
