name: Update PhotoCraft

# Every day: when upstream PhotoCraft has a stable release newer than the packaged one and at least
# MIN_AGE_HOURS old, move photocraft/ to the newest such release, build it, commit to main, tag
# photocraft-v<version> and create the release. Upstream releases often, so in-between versions are
# skipped. A build that fails against the new release stops here, and the next run tries again.
#
# The tag is pushed with GITHUB_TOKEN, which doesn't trigger photocraft-release.yml: this workflow
# creates the release itself.

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-photocraft
  cancel-in-progress: false

env:
  # Time for upstream to pull a bad release before we package it.
  MIN_AGE_HOURS: "24"

jobs:
  update:
    name: Package the newest PhotoCraft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(sed -n 's/^photocraft-engine = .*tag = "v\([^"]*\)".*/\1/p' photocraft/Cargo.toml)"
          cutoff="$(date -u -d "-$MIN_AGE_HOURS hours" +%Y-%m-%dT%H:%M:%SZ)"
          latest="$(gh release list --repo storytold/photocraft --exclude-drafts --exclude-pre-releases --limit 30 \
            --json tagName,publishedAt --jq ".[] | select(.publishedAt <= \"$cutoff\") | .tagName | ltrimstr(\"v\")" \
            | sort -V | tail -n 1)"
          if [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" = "$current" ]; then
            echo "PhotoCraft $current is up to date (newest release at least $MIN_AGE_HOURS hours old: ${latest:-none})." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "upstream=$latest" >> "$GITHUB_OUTPUT"
          echo "Packaging PhotoCraft $latest (was $current)." >> "$GITHUB_STEP_SUMMARY"
      - if: steps.plan.outputs.upstream
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            photocraft/target
          key: photocraft-cargo-update-${{ steps.plan.outputs.upstream }}
          restore-keys: photocraft-cargo-
      - if: steps.plan.outputs.upstream
        id: bump
        run: |
          version="$(photocraft/bump.sh "${{ steps.plan.outputs.upstream }}")"
          echo "tag=photocraft-v$version" >> "$GITHUB_OUTPUT"
      # Also updates Cargo.lock to the new release.
      - if: steps.plan.outputs.upstream
        run: photocraft/build.sh
      - if: steps.plan.outputs.upstream
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Package PhotoCraft ${{ steps.plan.outputs.upstream }}" -- photocraft/Cargo.toml photocraft/Cargo.lock
          git tag "$TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"
      - if: steps.plan.outputs.upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: photocraft/release.sh "${{ steps.bump.outputs.tag }}"
