[package]
name = "photocraft-wasm"
description = "The PhotoCraft image engine compiled to WebAssembly: open a file, run engine commands, read the composite"
# The PhotoCraft version that CI and local builds use. Releases don't change it: each one applies bump.sh
# (photocraft-release.yml) to set the tags below and this version, the upstream version with a two-digit
# packaging revision appended to the patch number (0.11.1 revision 1 is 0.11.101).
version = "0.11.101"
edition = "2024"
license = "MIT"
repository = "https://github.com/madcoons/artcraft-wasm"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
photocraft-engine = { git = "https://github.com/storytold/photocraft", tag = "v0.11.1" }
photocraft-compose = { git = "https://github.com/storytold/photocraft", tag = "v0.11.1" }
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"

[profile.release]
# Speed over size: a render composites the whole document on one thread.
opt-level = 3
lto = "thin"
codegen-units = 1
